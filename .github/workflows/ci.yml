name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: galla
          POSTGRES_PASSWORD: galla
          POSTGRES_DB: galla_mandi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U galla -d galla_mandi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://galla:galla@localhost:5432/galla_mandi
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      # Test-only values; real secrets live in the deployment environment.
      JWT_ACCESS_SECRET: ci-only-access-secret-not-used-anywhere-else
      OTP_SECRET: ci-only-otp-secret-not-used-anywhere-else-ok
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:e2e
      - run: npm run build
