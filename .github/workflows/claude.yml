name: Claude

# Lets Claude work on this repo. Mention @claude in an issue or pull request
# comment (or run "Start ticket" in gala-mandi/.github, which does it for you).
# Claude reads CLAUDE.md, writes the code on a new branch, and replies with a
# link to open the pull request.
#
# Needs ONE organization secret (Org settings > Secrets and variables > Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  - from `claude setup-token` (uses a Claude subscription), or
#   ANTHROPIC_API_KEY        - from platform.claude.com (pay per use)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
